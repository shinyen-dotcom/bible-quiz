<style>

    align-items: center;

    font-size: 14px;
    font-weight: 600;

  .q-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; line-height: 1.55; }

  .blank-input { border: none; border-bottom: 2.5px solid #64748b; background: #f1f5f9; padding: 2px 8px; font-size: 15px; font-weight: bold; color: #0f172a; text-align: center; margin: 0 4px; border-radius: 4px 4px 0 0; cursor: pointer; transition: all 0.2s ease; }

  .feedback { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .feedback.is-correct { display: block; background: var(--correct-bg); color: var(--correct); border: 1px solid #86efac; }

// 核心优化：动态精准 Answer Pool（只展示当前抽中填空题相关的词汇）
const DISTRACTOR_POOL = ["葡萄树", "桌子", "箱子", "二百", "按手", "睡着了", "二万", "迦百农", "岸上", "撒玛利亚", "伯赛大", "鞋", "摩西", "心", "律法", "儿女"];

function generateDynamicAnswerPool(selectedQuestions) {
  const answerSet = new Set();
  selectedQuestions.forEach(q => {
    if (q.type === "fill" && q.blanks) {
      q.blanks.forEach(b => {
        const primaryAns = b.ans.split("|")[0].trim();
        if (primaryAns) answerSet.add(primaryAns);
      });
    }
  });

  const shuffledDistractors = shuffleArray(DISTRACTOR_POOL);
  for (let i = 0; i < shuffledDistractors.length && answerSet.size < 22; i++) {
    answerSet.add(shuffledDistractors[i]);
  }

  return shuffleArray(Array.from(answerSet));
}

let activeMatchSet = []; 
let activeOtherSet = []; 
let activeDynamicWordPool = []; 
let activeBlankId = null;
const STORAGE_KEY = "mark_all_chapters_ch1to7_v7";

function shuffleArray(arr) {
  const array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function initQuiz(forceRegenerate = false) {
  const savedData = localStorage.getItem(STORAGE_KEY);
  if (!forceRegenerate && savedData) {
    try {
      const parsed = JSON.parse(savedData);
      activeMatchSet = parsed.matchPairs || [];
      activeOtherSet = parsed.otherQuestions || [];
      activeDynamicWordPool = parsed.wordPool || [];
      renderQuizUI();
      restoreSavedAnswers(parsed.answers || {});
      return;
    } catch(e) { console.error(e); }
  }

  // 1. 跨章节配对池混抽 7 组对子 (严格占题号 1 - 7)
  const shuffledPairs = shuffleArray(ALL_MATCHING_PAIRS);
  activeMatchSet = shuffledPairs.slice(0, 7);

  // 2. 从全量单题池中混抽 43 道单题 (严格占题号 8 - 50)
  const shuffledOthers = shuffleArray(ALL_SINGLE_QUESTIONS);
  const typeOrder = { "fill": 1, "radio": 2, "tf": 3 };
  activeOtherSet = shuffledOthers.slice(0, 43).sort((a, b) => typeOrder[a.type] - typeOrder[b.type]);

  // 3. 动态精准过滤本次填空题专属匹配的 Answer Pool
  activeDynamicWordPool = generateDynamicAnswerPool(activeOtherSet);

  saveQuizState({});
  renderQuizUI();
}

function regenerateQuiz() {
  if (confirm("确定要重新随机混抽 50 道跨章节测验题目（并靶向刷新专属词库）吗？")) {
    localStorage.removeItem(STORAGE_KEY);
    initQuiz(true);
  }
}

function renderQuizUI() {
  const container = document.getElementById("quiz-sections-container");
  container.innerHTML = "";

  let globalQuestionCounter = 1;

  // ---------------- PART 1: 跨章节配对题 (第 1 - 7 题) ----------------
  const matchSecHeader = document.createElement("div");
  matchSecHeader.className = "type-section-header";
  matchSecHeader.innerHTML = `

  container.appendChild(matchSecHeader);

  const matchItem = document.createElement("div");
  matchItem.className = "q-item";

  const letters = ["A", "B", "C", "D", "E", "F", "G"];
  const shuffledRight = shuffleArray(activeMatchSet.map(p => ({ pairId: p.id, text: p.rightText })));
  const targetMap = {};
  shuffledRight.forEach((item, i) => {
    targetMap[item.pairId] = letters[i];
  });

  let matchTableHtml = `
    <div class="match-table-wrap">
      <table class="match-table">
        <thead>
          <tr>
            <th class="col-num">题号与前半段 (经文出处)</th>
            <th class="col-input">填入字母</th>
            <th class="col-alpha">备选项（A - G 随机顺序）</th>
          </tr>
        </thead>
        <tbody>`;

  activeMatchSet.forEach((p, idx) => {
    const qNum = globalQuestionCounter;
    const correctLetter = targetMap[p.id];
    const rightItem = shuffledRight[idx];

    matchTableHtml += `
      <tr>
        <td class="col-num"><strong>${qNum}.</strong> <span style="font-size:12px; color:#2563eb; font-weight:bold;">[${p.ch}]</span> ${p.left}</td>
        <td class="col-input">
          <select class="match-select match-row-select" id="m_row_${p.id}" data-ans="${correctLetter}" onchange="onUserAnswerChange()">
            <option value="">-</option>
            <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option>
          </select>
        </td>
        <td class="col-alpha"><strong>${letters[idx]}.</strong> ${rightItem.text}</td>
      </tr>`;
    
    globalQuestionCounter++;
  });

  matchTableHtml += `</tbody></table></div><div class="feedback" id="fb-matching-all"></div>`;
  matchItem.innerHTML = matchTableHtml;
  container.appendChild(matchItem);

  // ---------------- PART 2: 剩余 43 道题目 (第 8 - 50 题) ----------------

    "fill": { title: "第二部分：填空题", desc: "请根据下方专为此套题目匹配的词库填入空格（点击词汇填入，点击输入框反选清除）：", list: [] },
    "radio": { title: "第三部分：单选、多选与排序题", desc: "请点按正确选项：", list: [] },
    "tf": { title: "第四部分：是非判断题", desc: "判断下列说法是否正确（√ 正确，× 错误）：", list: [] }
  };

  activeOtherSet.forEach(q => {
    if (subGroups[q.type]) subGroups[q.type].list.push(q);
  });

  ["fill", "radio", "tf"].forEach(typeKey => {
    const grp = subGroups[typeKey];
    if (grp.list.length === 0) return;

    const startNum = globalQuestionCounter;
    const endNum = globalQuestionCounter + grp.list.length - 1;

    const secHeader = document.createElement("div");
    secHeader.className = "type-section-header";
    secHeader.innerHTML = `
      <h3 class="type-section-title">${grp.title}（第 ${startNum} - ${endNum} 题）</h3>
      <p class="type-section-desc">${grp.desc}</p>
    `;
    container.appendChild(secHeader);

    // 智能精准过滤后的 Answer Pool 专属呈现
    if (typeKey === "fill") {
      const bankCard = document.createElement("div");
      bankCard.className = "word-bank-box";
      bankCard.innerHTML = `
        <div class="word-bank-title">
          <span>💡 动态精准词库 (Answer Pool)：点击词汇填入，点击输入框反选清除</span>

        </div>
        <div class="word-chips" id="word-chips-container"></div>
      `;
      container.appendChild(bankCard);
    }

    grp.list.forEach(q => {
      const item = document.createElement("div");
      item.className = "q-item";
      item.id = `card-${q.id}`;

      if (q.type === "fill") {
        let fillText = q.title;
        q.blanks.forEach(b => {
          const inputHtml = `<input type="text" class="blank-input" id="${b.id}" data-ans="${b.ans}" readonly onclick="handleBlankClick(this)">`;

        item.innerHTML = `
          <div style="font-size:15px; line-height:2.4; word-break:break-word;">

          <div class="feedback" id="fb-${q.id}"></div>
        `;
      } else if (q.type === "radio") {
        const isMulti = Array.isArray(q.ans);
        let optsHtml = `<div class="opt-group">`;
        q.opts.forEach(opt => {
          const inputType = isMulti ? "checkbox" : "radio";
          optsHtml += `<label class="opt-label"><input type="${inputType}" name="${q.id}" value="${opt.v}" onchange="onUserAnswerChange()"> ${opt.t}</label>`;
        });
        optsHtml += `</div>`;
        item.innerHTML = `
          <div class="q-title"><span style="color:var(--accent); font-weight:bold;">${globalQuestionCounter}.</span> ${q.title}</div>
          ${optsHtml}
          <div class="feedback" id="fb-${q.id}"></div>
        `;
      } else if (q.type === "tf") {
        item.innerHTML = `
          <div class="q-title"><span style="color:var(--accent); font-weight:bold;">${globalQuestionCounter}.</span> ${q.title}</div>
          <div class="opt-group" style="flex-direction:row; max-width:280px;">
            <label class="opt-label" style="flex:1;"><input type="radio" name="${q.id}" value="T" onchange="onUserAnswerChange()"> √ 正确</label>
            <label class="opt-label" style="flex:1;"><input type="radio" name="${q.id}" value="F" onchange="onUserAnswerChange()"> × 错误</label>
          </div>
          <div class="feedback" id="fb-${q.id}"></div>
        `;
      }

      container.appendChild(item);
      globalQuestionCounter++;
    });
  });

  if (document.getElementById("word-chips-container")) {
    renderWordBank();
  }

  calculateAndUpdateTotals(0);
}

function renderWordBank() {
  const container = document.getElementById("word-chips-container");
  if (!container) return;
  container.innerHTML = "";
  activeDynamicWordPool.forEach(word => {
    const chip = document.createElement("span");
    chip.className = "word-chip";
    chip.innerText = word;
    chip.onclick = () => insertWordToBlank(word);
    container.appendChild(chip);
  });
}

function handleBlankClick(inputEl) {
  if (inputEl.value) {
    inputEl.value = "";
    inputEl.classList.remove("has-val");
    onUserAnswerChange();
  }
  document.querySelectorAll(".blank-input").forEach(b => b.classList.remove("active-blank"));
  inputEl.classList.add("active-blank");
  activeBlankId = inputEl.id;
}

function insertWordToBlank(word) {
  let target = null;
  if (activeBlankId) {
    target = document.getElementById(activeBlankId);
  }
  if (!target || target.value) {
    const blanks = Array.from(document.querySelectorAll(".blank-input"));
    target = blanks.find(b => !b.value);
  }

  if (target) {
    target.value = word;
    target.classList.add("has-val");
    onUserAnswerChange();

    const blanks = Array.from(document.querySelectorAll(".blank-input"));
    const nextEmpty = blanks.find(b => !b.value);
    blanks.forEach(b => b.classList.remove("active-blank"));
    if (nextEmpty) {
      nextEmpty.classList.add("active-blank");
      activeBlankId = nextEmpty.id;
    } else {
      activeBlankId = target.id;
      target.classList.add("active-blank");
    }
  }
}

function onUserAnswerChange() {
  saveQuizState(getUserAnswers());
}

function getUserAnswers() {
  const answers = {};
  document.querySelectorAll("#quiz-sections-container input").forEach(el => {
    if (el.type === "radio" || el.type === "checkbox") {
      if (el.checked) {
        if (!answers[el.name]) {
          answers[el.name] = el.type === "checkbox" ? [el.value] : el.value;
        } else if (Array.isArray(answers[el.name])) {
          answers[el.name].push(el.value);
        }
      }
    } else if (el.type === "text") {
      if (el.value) answers[el.id] = el.value;
    }
  });
  return answers;
}

function saveQuizState(answers) {
  const data = {
    matchPairs: activeMatchSet,
    otherQuestions: activeOtherSet,
    wordPool: activeDynamicWordPool,
    answers: answers || getUserAnswers()
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  document.getElementById("save-status").innerText = "💾 进度已自动保存 (" + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ")";
}

function restoreSavedAnswers(answers) {
  Object.keys(answers).forEach(key => {
    const val = answers[key];
    const textEl = document.getElementById(key);
    if (textEl && textEl.type === "text") {
      textEl.value = val;
      textEl.classList.add("has-val");
    } else if (Array.isArray(val)) {
      val.forEach(v => {
        const chk = document.querySelector(`input[name="${key}"][value="${v}"]`);
        if (chk) chk.checked = true;
      });
    } else {
      const rad = document.querySelector(`input[name="${key}"][value="${val}"]`);
      if (rad) rad.checked = true;
    }
  });
}

function gradeQuiz() {
  let score = 0;

  // 1. 批改跨章节配对题 (7 题)
  let mOk = 0;
  let mErrs = [];
  activeMatchSet.forEach(p => {
    const sel = document.getElementById("m_row_" + p.id);
    const v = (sel.value || "").toUpperCase();
    const expected = sel.getAttribute("data-ans");
    if (v === expected) {
      mOk++;
      score++;
      sel.style.borderColor = "#16a34a";
      sel.style.background = "#dcfce7";
    } else {
      sel.style.borderColor = "#dc2626";
      sel.style.background = "#fee2e2";
      mErrs.push(`${p.left.slice(0, 8)}...应选【${expected}】`);
    }
  });

  const fbMatch = document.getElementById("fb-matching-all");
  if (mOk === activeMatchSet.length) {
    fbMatch.className = "feedback is-correct";
    fbMatch.innerHTML = `配对题 7 题全部正确！`;
  } else {
    fbMatch.className = "feedback is-wrong";
    fbMatch.innerHTML = `配对题答对 ${mOk} / ${activeMatchSet.length}。错误提示：${mErrs.join("； ")}`;
  }

  // 2. 批改其余 43 题
  activeOtherSet.forEach(q => {
    const fb = document.getElementById(`fb-${q.id}`);

    if (q.type === "radio" || q.type === "tf") {
      let isCorrect = false;
      if (Array.isArray(q.ans)) {
        const checked = Array.from(document.querySelectorAll(`input[name="${q.id}"]:checked`)).map(e => e.value);
        if (checked.length === q.ans.length && q.ans.every(v => checked.includes(v))) {
          isCorrect = true;
        }
      } else {
        const checked = document.querySelector(`input[name="${q.id}"]:checked`);
        if (checked && checked.value === q.ans) {
          isCorrect = true;
        }
      }
      
      if (isCorrect) {
        score++;
        fb.className = "feedback is-correct";
        fb.innerHTML = `正确！解析：${q.desc}`;
      } else {
        fb.className = "feedback is-wrong";
        const ansTxt = Array.isArray(q.ans) ? q.ans.join(", ").toUpperCase() : (q.ans === "T" ? "√ 正确" : (q.ans === "F" ? "× 错误" : q.ans.toUpperCase()));
        fb.innerHTML = `标准答案：【${ansTxt}】。解析：${q.desc}`;
      }
    } else if (q.type === "fill") {
      let fillOk = true;
      q.blanks.forEach(b => {
        const el = document.getElementById(b.id);
        const userVal = (el ? el.value.trim() : "");
        const validAns = b.ans.split("|").map(s => s.trim());
        if (validAns.includes(userVal)) {
          el.style.borderBottomColor = "#16a34a"; el.style.background = "#dcfce7";
        } else {
          fillOk = false;
          if (el) { el.style.borderBottomColor = "#dc2626"; el.style.background = "#fee2e2"; }
        }
      });

      if (fillOk) {
        score++;
        fb.className = "feedback is-correct";
        fb.innerHTML = `正确！出处：${q.desc}`;
      } else {
        fb.className = "feedback is-wrong";
        const correctAns = q.blanks.map(b => b.ans.split("|")[0]).join(" / ");
        fb.innerHTML = `正确答案：【${correctAns}】。解析：${q.desc}`;
      }
    }
  });

  calculateAndUpdateTotals(score);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function calculateAndUpdateTotals(score) {
  const total = 50;
  document.getElementById("total-score").innerText = `${score} / ${total}`;
  document.getElementById("accuracy-rate").innerText = `${Math.round((score / total) * 100)}%`;
}

window.addEventListener("DOMContentLoaded", () => {
  initQuiz();
});
</script>
